<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clientes - Lexxa Bagno</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para Leitura e Exportação Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- SDKs do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        apiKey: "AIzaSy...",
  authDomain: "lexxa-clientes.firebaseapp.com",
  projectId: "lexxa-clientes",
  storageBucket: "lexxa-clientes.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123def456"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const clientesRef = collection(db, "clientes");

        window.db = db;
        window.clientesRef = clientesRef;
        window.addDoc = addDoc;
        window.writeBatch = writeBatch;
        window.doc = doc;

        const q = query(clientesRef);
        onSnapshot(q, (snapshot) => {
            const data = [];
            snapshot.forEach((doc) => {
                data.push({ id: doc.id, ...doc.data() });
            });
            window.rawData = data;
            window.initApp();
        }, (error) => {
            console.error("Erro ao sincronizar com Firebase:", error);
        });
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans relative">

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        <span id="toastMsg">Operação realizada com sucesso!</span>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Cabeçalho -->
        <div class="mb-6 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse inline-block"></span>
                    <span class="text-xs font-semibold tracking-wider uppercase text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-100">
                        Nuvem Ativa • Sincronização em Tempo Real
                    </span>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                    Painel de Clientes - Lexxa Bagno
                </h1>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <!-- Botão para importar planilha antiga -->
                <label class="cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    Importar Planilha Antiga
                    <input type="file" id="excelImporter" accept=".xlsx, .xls" class="hidden" onchange="importarExcelParaFirebase(event)">
                </label>

                <button onclick="exportToExcel()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Exportar Excel
                </button>
            </div>
        </div>

        <!-- NAVEGAÇÃO POR ABAS -->
        <div class="flex border-b border-slate-200 mb-6 gap-2">
            <button id="tabConsultaBtn" onclick="switchTab('consulta')" class="px-5 py-3 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 transition">
                🔍 Consultar Clientes
            </button>
            <button id="tabCadastroBtn" onclick="switchTab('cadastro')" class="px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition">
                ➕ Cadastrar Novo Cliente
            </button>
        </div>

        <!-- ABA CONSULTA -->
        <div id="tabConsulta" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div>
                    <label for="globalSearch" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                        Busca Rápida (Cliente, CNPJ, Vendedor, Endereço, Cidade ou E-mail)
                    </label>
                    <div class="relative">
                        <input type="text" id="globalSearch" placeholder="Digite para pesquisar em tempo real..." class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-base focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
                    <div>
                        <label for="filterUF" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Estado (UF)</label>
                        <select id="filterUF" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">Todos os Estados</option>
                        </select>
                    </div>

                    <div>
                        <label for="filterVendedor" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Vendedor / Representante</label>
                        <select id="filterVendedor" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">Todos os Vendedores</option>
                        </select>
                    </div>

                    <div>
                        <label for="filterCidade" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Cidade</label>
                        <input type="text" id="filterCidade" placeholder="Filtrar cidade..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between px-2">
                <span id="counter" class="text-sm font-medium text-slate-600">Sincronizando com a nuvem...</span>
                <button id="btnClear" class="text-xs text-blue-600 hover:text-blue-800 font-semibold underline">Limpar Filtros</button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto max-h-[600px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 sticky top-0 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500 z-10">
                            <tr>
                                <th class="p-4">Cliente / CNPJ</th>
                                <th class="p-4">Cidade / UF</th>
                                <th class="p-4">Vendedor</th>
                                <th class="p-4">Contato</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
                            <tr>
                                <td colspan="5" class="text-center py-12 text-slate-400">Carregando dados da nuvem...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ABA CADASTRO -->
        <div id="tabCadastro" class="hidden">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 max-w-4xl mx-auto">
                <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                    Formulário de Cadastro na Nuvem
                </h2>

                <form id="formNovoCliente" onsubmit="salvarNovoCliente(event)" class="space-y-6">
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Informações do Cliente</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome / Razão Social *</label>
                                <input type="text" id="novoNome" required placeholder="Ex: MARCOS FERNANDO LUZ LTDA" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">CPF / CNPJ *</label>
                                <input type="text" id="novoDoc" required placeholder="00.000.000/0000-00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div class="sm:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Endereço Completo</label>
                                <input type="text" id="novoEnd" placeholder="Rua, Número, Bairro" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">CEP</label>
                                <input type="text" id="novoCEP" placeholder="00000-000" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Cidade *</label>
                                <input type="text" id="novoCidade" required placeholder="Ex: São Paulo" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">UF (Estado) *</label>
                                <input type="text" id="novoUF" maxlength="2" required placeholder="SP" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Telefone Cliente</label>
                                <input type="text" id="novoTel" placeholder="(00) 00000-0000" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div class="sm:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail (NF-e)</label>
                                <input type="email" id="novoEmail" placeholder="contato@empresa.com" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Vendedor / Representante</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Vendedor *</label>
                                <input type="text" id="novoVendedor" required placeholder="Ex: CAON REPRESENTACAO" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">CPF / CNPJ Vendedor</label>
                                <input type="text" id="novoVendedorDoc" placeholder="00.000.000/0001-00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Telefone Vendedor</label>
                                <input type="text" id="novoVendedorTel" placeholder="(00) 00000-0000" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4">
                        <button type="button" onclick="switchTab('consulta')" class="px-5 py-2.5 text-xs font-semibold text-slate-600 hover:text-slate-800">Cancelar</button>
                        <button type="submit" id="btnSalvar" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            Salvar na Nuvem
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Modal Detalhes -->
    <div id="clientModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 relative">
            <button id="closeModal" onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        window.rawData = [];
        let currentFilteredData = [];

        const COL_NOME = 'Nome';
        const COL_DOC = 'CPF/CNPJ';
        const COL_END = 'Endereço';
        const COL_CIDADE = 'Cidade';
        const COL_UF = 'UF';
        const COL_CEP = 'CEP';
        const COL_TEL = 'Telefone';
        const COL_EMAIL = 'E-mail (NF-e)';

        function normalizeStr(str) {
            return String(str || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function switchTab(tab) {
            const tabConsulta = document.getElementById('tabConsulta');
            const tabCadastro = document.getElementById('tabCadastro');
            const tabConsultaBtn = document.getElementById('tabConsultaBtn');
            const tabCadastroBtn = document.getElementById('tabCadastroBtn');

            if (tab === 'consulta') {
                tabConsulta.classList.remove('hidden');
                tabCadastro.classList.add('hidden');
                tabConsultaBtn.className = "px-5 py-3 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 transition";
                tabCadastroBtn.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition";
            } else {
                tabConsulta.classList.add('hidden');
                tabCadastro.classList.remove('hidden');
                tabCadastroBtn.className = "px-5 py-3 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 transition";
                tabConsultaBtn.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition";
            }
        }

        window.initApp = function() {
            populateDropdowns();
            renderTable(window.rawData);
            setupEvents();
        };

        function populateDropdowns() {
            const ufs = [...new Set(window.rawData.map(i => i[COL_UF]).filter(Boolean))].sort();
            const vendedores = [...new Set(window.rawData.map(i => i['Vendedor:'] || i['Vendedor']).filter(Boolean))].sort();

            document.getElementById('filterUF').innerHTML = '<option value="">Todos os Estados</option>' + 
                ufs.map(uf => `<option value="${uf}">${uf}</option>`).join('');

            document.getElementById('filterVendedor').innerHTML = '<option value="">Todos os Vendedores</option>' + 
                vendedores.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function filterData() {
            const globalQuery = normalizeStr(document.getElementById('globalSearch').value);
            const uf = normalizeStr(document.getElementById('filterUF').value);
            const vendedor = normalizeStr(document.getElementById('filterVendedor').value);
            const cidade = normalizeStr(document.getElementById('filterCidade').value);

            const filtered = window.rawData.filter(row => {
                const rowNome = normalizeStr(row[COL_NOME]);
                const rowDoc = normalizeStr(row[COL_DOC]);
                const rowCidade = normalizeStr(row[COL_CIDADE]);
                const rowEnd = normalizeStr(row[COL_END]);
                const rowEmail = normalizeStr(row[COL_EMAIL]);
                const rowUF = normalizeStr(row[COL_UF]);
                const rowVendedor = normalizeStr(row['Vendedor:'] || row['Vendedor']);

                const matchesGlobal = !globalQuery || 
                    rowNome.includes(globalQuery) || 
                    rowDoc.includes(globalQuery) || 
                    rowCidade.includes(globalQuery) || 
                    rowEnd.includes(globalQuery) || 
                    rowEmail.includes(globalQuery) ||
                    rowVendedor.includes(globalQuery);

                const matchesUF = !uf || rowUF === uf;
                const matchesVendedor = !vendedor || rowVendedor === vendedor;
                const matchesCidade = !cidade || rowCidade.includes(cidade);

                return matchesGlobal && matchesUF && matchesVendedor && matchesCidade;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            currentFilteredData = data;
            const tbody = document.getElementById('tableBody');
            const counter = document.getElementById('counter');

            counter.textContent = `Exibindo ${data.length.toLocaleString('pt-BR')} cliente(s)`;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400">Nenhum cliente cadastrado no banco. Clique em "Importar Planilha Antiga" acima para carregar sua base.</td></tr>`;
                return;
            }

            const items = data.slice(0, 200);

            tbody.innerHTML = items.map((row, idx) => {
                const telClean = String(row[COL_TEL] || '').replace(/\D/g, '');
                const hasWhats = telClean.length >= 10;
                const vNome = row['Vendedor:'] || row['Vendedor'] || 'Sem Vendedor';
                const vTel = row['Telefone Vendedor:'] || row['Telefone Vendedor'] || '';

                return `
                <tr class="hover:bg-slate-50 transition cursor-pointer" onclick="openModal(${idx})">
                    <td class="p-4">
                        <div class="font-bold text-slate-900">${row[COL_NOME] || '-'}</div>
                        <div class="text-xs text-slate-400 font-mono mt-0.5">${row[COL_DOC] || '-'}</div>
                    </td>
                    <td class="p-4">
                        <div class="font-medium text-slate-800">${row[COL_CIDADE] || '-'}</div>
                        <span class="inline-block bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-semibold">${row[COL_UF] || '-'}</span>
                    </td>
                    <td class="p-4 text-xs">
                        <div class="font-semibold text-blue-700">${vNome}</div>
                        ${vTel ? `<div class="text-slate-400 text-[11px] mt-0.5">${vTel}</div>` : ''}
                    </td>
                    <td class="p-4 text-xs">
                        <div>${row[COL_TEL] || '-'}</div>
                        <div class="text-slate-400 truncate max-w-[180px]">${row[COL_EMAIL] || '-'}</div>
                    </td>
                    <td class="p-4 text-center" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-center gap-2">
                            ${hasWhats ? `
                                <a href="https://wa.me/55${telClean}" target="_blank" title="Abrir WhatsApp" class="p-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg transition">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                                </a>
                            ` : ''}
                            <button onclick="copyClientInfo(${idx})" title="Copiar Dados" class="p-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        // FUNÇÃO PARA ENVIAR OS DADOS DA PLANILHA ANTIGA PARA O FIREBASE
        async function importarExcelParaFirebase(e) {
            const file = e.target.files[0];
            if (!file) return;

            showToast("Lendo arquivo Excel...");
            const reader = new FileReader();

            reader.onload = async function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

                    if (rows.length === 0) {
                        alert("A planilha selecionada está vazia.");
                        return;
                    }

                    showToast(`Subindo ${rows.length} clientes para a Nuvem...`);

                    // Processa em lotes (batches de 400) para performance
                    let count = 0;
                    let batch = window.writeBatch(window.db);

                    for (const row of rows) {
                        const newDocRef = window.doc(window.clientesRef);
                        batch.set(newDocRef, {
                            ...row,
                            criadoEm: new Date().toISOString()
                        });
                        count++;

                        if (count % 400 === 0) {
                            await batch.commit();
                            batch = window.writeBatch(window.db);
                        }
                    }

                    if (count % 400 !== 0) {
                        await batch.commit();
                    }

                    showToast(`${rows.length} clientes importados com sucesso!`);
                } catch (err) {
                    console.error("Erro na importação:", err);
                    alert("Ocorreu um erro ao importar a planilha. Verifique as regras do Firebase.");
                }
            };

            reader.readAsArrayBuffer(file);
        }

        async function salvarNovoCliente(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.textContent = "Salvando na Nuvem...";

            const novoObj = {
                "Nome": document.getElementById('novoNome').value.trim(),
                "CPF/CNPJ": document.getElementById('novoDoc').value.trim(),
                "Endereço": document.getElementById('novoEnd').value.trim(),
                "CEP": document.getElementById('novoCEP').value.trim(),
                "Cidade": document.getElementById('novoCidade').value.trim(),
                "UF": document.getElementById('novoUF').value.trim().toUpperCase(),
                "Telefone": document.getElementById('novoTel').value.trim(),
                "E-mail (NF-e)": document.getElementById('novoEmail').value.trim(),
                "Vendedor:": document.getElementById('novoVendedor').value.trim(),
                "CPF/CNPJ Vendedor:": document.getElementById('novoVendedorDoc').value.trim(),
                "Telefone Vendedor:": document.getElementById('novoVendedorTel').value.trim(),
                "criadoEm": new Date().toISOString()
            };

            try {
                await window.addDoc(window.clientesRef, novoObj);
                document.getElementById('formNovoCliente').reset();
                showToast("Cliente salvo na Nuvem!");
                switchTab('consulta');
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar no banco.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Salvar na Nuvem`;
            }
        }

        function exportToExcel() {
            const worksheet = XLSX.utils.json_to_sheet(window.rawData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Clientes");
            XLSX.writeFile(workbook, "Base Clientes Firebase.xlsx");
            showToast("Planilha gerada com a base da nuvem!");
        }

                <p class="text-xs text-slate-400 font-mono mb-6">${row[COL_DOC] || '-'}</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">

                        <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Vendedor / Representante</span>
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <span class="font-bold text-blue-700 text-lg">${row['Vendedor:'] || row['Vendedor'] || 'Não informado'}</span>
                            <div class="flex flex-wrap items-center gap-2">

                                    <strong class="text-slate-400 font-sans">CPF/CNPJ:</strong> ${row['CPF/CNPJ Vendedor:'] || row['CPF/CNPJ Vendedor'] || '-'}
                                </span>
                                <span class="text-xs bg-white px-2.5 py-1 rounded-md border border-slate-200 text-slate-600 shadow-sm">
                                    <strong class="text-slate-400">Tel:</strong> ${row['Telefone Vendedor:'] || row['Telefone Vendedor'] || '-'}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="block text-xs font-semibold text-slate-400 uppercase">Localização</span>
                        <span class="font-medium text-slate-800">${row[COL_CIDADE] || '-'} / ${row[COL_UF] || '-'}</span>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="block text-xs font-semibold text-slate-400 uppercase">CEP</span>
                        <span class="text-slate-800 font-mono">${row[COL_CEP] || '-'}</span>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl sm:col-span-2">
                        <span class="block text-xs font-semibold text-slate-400 uppercase">Endereço Completo</span>

                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="block text-xs font-semibold text-slate-400 uppercase">Telefone Cliente</span>
                        <span class="text-slate-800">${row[COL_TEL] || '-'}</span>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="block text-xs font-semibold text-slate-400 uppercase">E-mail (NF-e)</span>
                        <span class="text-slate-800 break-all">${row[COL_EMAIL] || '-'}</span>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            document.getElementById('clientModal').classList.add('hidden');
        }

        function copyClientInfo(idx) {
            const row = currentFilteredData[idx];
            if (!row) return;

            const text = `Cliente: ${row[COL_NOME] || '-'}
CPF/CNPJ: ${row[COL_DOC] || '-'}
Endereço: ${row[COL_END] || '-'} - ${row[COL_CIDADE] || '-'}/${row[COL_UF] || '-'} (CEP: ${row[COL_CEP] || '-'})
Telefone: ${row[COL_TEL] || '-'}
E-mail: ${row[COL_EMAIL] || '-'}
Vendedor: ${row['Vendedor:'] || row['Vendedor'] || '-'}
CPF/CNPJ Vendedor: ${row['CPF/CNPJ Vendedor:'] || row['CPF/CNPJ Vendedor'] || '-'}
Tel. Vendedor: ${row['Telefone Vendedor:'] || row['Telefone Vendedor'] || '-'}`.trim();

            navigator.clipboard.writeText(text).then(() => showToast("Dados copiados!"));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function setupEvents() {
            document.getElementById('globalSearch').addEventListener('input', filterData);
            document.getElementById('filterUF').addEventListener('change', filterData);
            document.getElementById('filterVendedor').addEventListener('change', filterData);
            document.getElementById('filterCidade').addEventListener('input', filterData);

            document.getElementById('btnClear').addEventListener('click', () => {
                document.getElementById('globalSearch').value = '';
                document.getElementById('filterUF').value = '';
                document.getElementById('filterVendedor').value = '';
                document.getElementById('filterCidade').value = '';
                renderTable(window.rawData);
            });
        }
    </script>
